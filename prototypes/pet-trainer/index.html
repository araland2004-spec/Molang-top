(() => {
// =====================================================================

const norm = (x, y) => { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; };

  const n = parseInt(hex.slice(1), 16); let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;

}

const ITEM_NAME = { heal: '회복 젤리', snack: '매운 간식', shell: '단단 껍질', orb: '반짝 구슬' };

// ---------------------------------------------------------------- 화면

// ---------------------------------------------------------------- 소리
let AC = null, muted = false;
function initAudio() { if (AC) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
function beep(f = 440, d = 0.08, type = 'square', v = 0.05, slide = 0) {
  if (muted || !AC) return;
  try {
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);

const seq = (notes, gap, d, type, v) => notes.forEach((f, i) => setTimeout(() => beep(f, d, type, v), i * gap));
const SFX = {

// ---------------------------------------------------------------- 입력
const keys = {};
const pressed = new Set();

});
addEventListener('keyup', e => { keys[e.code] = false; });
let buttons = [];
const pressMap = {};
let joy = null;
function btnAt(x, y) {
  for (let i = buttons.length - 1; i >= 0; i--) { const b = buttons[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b; }
  return null;
}
cv.addEventListener('pointerdown', e => {
  initAudio();
  const x = e.clientX, y = e.clientY;
  const b = btnAt(x, y);
  if (b) { if (!b.disabled) { pressMap[b.id] = 0.14; b.cb(); } e.preventDefault(); return; }
  if (!joy && joyAllowed(x, y)) joy = { id: e.pointerId, sx: x, sy: y, x, y };
  e.preventDefault();
});
cv.addEventListener('pointermove', e => { if (joy && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });
const endJoy = e => { if (joy && e.pointerId === joy.id) joy = null; };
cv.addEventListener('pointerup', endJoy);
cv.addEventListener('pointercancel', endJoy);
cv.addEventListener('contextmenu', e => e.preventDefault());
function joyAllowed(x, y) {
  if (!G) return false;
  if (G.state === 'explore') return true;
  if (G.state === 'battle' && B && B.humanRole === 'pet' && !AUTO && B.ctrl) return x > B.ctrl.x && x < B.ctrl.x + B.ctrl.w * 0.56 && y > B.ctrl.y + 50 * U;
  return false;
}
function joyVec() {
  let x = 0, y = 0;
  if (keys.KeyA || keys.ArrowLeft) x -= 1; if (keys.KeyD || keys.ArrowRight) x += 1;
  if (keys.KeyW || keys.ArrowUp) y -= 1; if (keys.KeyS || keys.ArrowDown) y += 1;
  if (joy) {
    const R0 = 46 * U; let dx = joy.x - joy.sx, dy = joy.y - joy.sy; const l = Math.hypot(dx, dy);
    if (l > R0) { dx *= R0 / l; dy *= R0 / l; }

// ---------------------------------------------------------------- 그리기 도구
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function txt(t, x, y, size, color = '#3a2e2a', align = 'center', weight = 800) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y);
}

  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';

  ctx.save(); ctx.fillStyle = 'rgba(60,40,30,0.18)'; rr(x, y + 3 * U, w, h, r); ctx.fill();
  ctx.fillStyle = fill; rr(x, y, w, h, r); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = stroke; ctx.stroke(); ctx.restore();
}

  const col = o.color || '#ffffff', r = o.round ? Math.min(w, h) / 2 : (o.r || 14 * U);

}
function heart(x, y, s, fill) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 16, s / 16);
  ctx.beginPath(); ctx.moveTo(0, 5); ctx.bezierCurveTo(-9, -2, -7, -10, 0, -5); ctx.bezierCurveTo(7, -10, 9, -2, 0, 5); ctx.closePath();

function star(x, y, r, col = '#ffcf3f') {
  ctx.save(); ctx.translate(x, y); ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; ctx.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); }

}

  ctx.fillStyle = bg; rr(x, y, w, h, h / 2); ctx.fill();

}
function matIcon(type, x, y, s) {
  ctx.save(); ctx.translate(x, y);
  if (type === 'berry') {
    ctx.fillStyle = '#e8414f'; ctx.beginPath(); ctx.arc(-s * 0.3, s * 0.15, s * 0.5, 0, TAU); ctx.arc(s * 0.32, s * 0.2, s * 0.46, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(-s * 0.45, 0, s * 0.13, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4caf50'; ctx.beginPath(); ctx.ellipse(0, -s * 0.45, s * 0.42, s * 0.18, -0.3, 0, TAU); ctx.fill();
  } else if (type === 'stone') {
    ctx.fillStyle = '#9aa3ad'; ctx.beginPath(); ctx.moveTo(-s * 0.7, s * 0.3); ctx.lineTo(-s * 0.45, -s * 0.4); ctx.lineTo(s * 0.2, -s * 0.6); ctx.lineTo(s * 0.7, -s * 0.05); ctx.lineTo(s * 0.5, s * 0.5); ctx.lineTo(-s * 0.3, s * 0.6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.moveTo(-s * 0.4, -s * 0.3); ctx.lineTo(s * 0.15, -s * 0.48); ctx.lineTo(-s * 0.05, -s * 0.1); ctx.closePath(); ctx.fill();
  } else if (type === 'feather') {
    ctx.rotate(-0.6); ctx.fillStyle = '#e9f4ff'; ctx.strokeStyle = '#7aa7d8'; ctx.lineWidth = Math.max(1, s * 0.12);
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.32, s * 0.78, 0, 0, TAU); ctx.fill(); ctx.stroke();

}
function itemIcon(type, x, y, s) {
  ctx.save(); ctx.translate(x, y);
  if (type === 'heal') {
    ctx.fillStyle = '#ff9ec4'; rr(-s * 0.7, -s * 0.55, s * 1.4, s * 1.2, s * 0.45); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; rr(-s * 0.5, -s * 0.42, s * 0.5, s * 0.25, s * 0.12); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-s * 0.12, -s * 0.3, s * 0.24, s * 0.7); ctx.fillRect(-s * 0.35, -s * 0.07, s * 0.7, s * 0.24);
  } else if (type === 'snack') {

// ---------------------------------------------------------------- 캐릭터 그리기
// o: ears('cat'|'dog'|'bun'|'bear'), hat, face{x,y}, mood('hurt'|'tired'|'happy'|'sleep'), tail, air, squash, alpha, t, flash
function drawCritter(x, y, r, col, o = {}) {

  const fx = (o.face && o.face.x) || 0, fy = (o.face && o.face.y) || 0;

    ctx.restore();
  }
  const ears = o.ears;
  if (ears === 'cat') {
    for (const s of [-1, 1]) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(s * r * 0.75, -r * 0.35); ctx.lineTo(s * r * 0.62, -r * 1.12); ctx.lineTo(s * r * 0.15, -r * 0.78); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffb3c4'; ctx.beginPath(); ctx.moveTo(s * r * 0.62, -r * 0.55); ctx.lineTo(s * r * 0.58, -r * 0.92); ctx.lineTo(s * r * 0.3, -r * 0.74); ctx.closePath(); ctx.fill(); }
  } else if (ears === 'bun') {

  drawTeamTop(en);
  // 지시 배너 (내가 펫일 때)
  if (B.humanRole === 'pet' && my.cmd && my.trainer && !B.over) {
    const c = my.cmd, bw = Math.min(L.aw - 30 * U, 300 * U), bh = 46 * U, bx = L.ax + (L.aw - bw) / 2, by = L.ay + 10 * U;
    const col = { attack: '#ff6b6b', dodge: '#4dabf7', special: '#fcc419' }[c.type];
    ctx.save(); ctx.globalAlpha = 0.95; panel(bx, by, bw, bh, bh / 2, '#fff', col);
    ctx.fillStyle = col; rr(bx, by + bh - 6 * U, bw * clamp(c.t / c.dur, 0, 1), 6 * U, 3 * U); ctx.fill();
    txt(`${my.trainer.name}: ${CMD_TXT[c.type]}`, bx + bw / 2, by + bh / 2 - 2 * U, 20 * U, shade(col.slice(0, 7), -0.25), 'center', 900);
    ctx.restore();
  }
  // 아래: 내 팀 정보 + 조작
  drawControls(my);
  // 인트로 · 끝
  if (B.intro > 0) {
    dimBg(0.35);
    const lines = B.humanRole === 'pet'
      ? ['너는 펫!', '직접 움직여서 싸워요', my.trainer ? `트레이너 ${my.trainer.name}의 지시를 따르면 보너스!` : '혼자라서 필살기는 게이지가 차면 바로!']
      : B.humanRole === 'trainer' ? ['너는 트레이너!', `펫 ${my.petP.name}에게 지시하고 아이템을 써요`, '친밀도가 높을수록 말을 잘 들어요'] : ['관전'];
    txtO(lines[0], W / 2, H * 0.36, 34 * U, B.humanRole === 'pet' ? '#f08c00' : '#1c7ed6', '#fff');
    txtO(lines[1], W / 2, H * 0.36 + 44 * U, 16 * U, '#fff', 'rgba(40,30,50,0.85)');
    txtO(lines[2] || '', W / 2, H * 0.36 + 70 * U, 14 * U, '#fff', 'rgba(40,30,50,0.85)');
    txtO(B.intro > 0.55 ? '준비…' : '시작!', W / 2, H * 0.36 + 116 * U, 30 * U, '#fff', '#e8590c');
  }
  if (B.over) {
    dimBg(0.3);
    const won = B.winner === B.mySide;
    txtO(won ? '승리!' : '패배…', W / 2, H * 0.38, 46 * U, won ? '#ffd43b' : '#a5d8ff', 'rgba(50,30,30,0.9)');
    let sub = '';
    if (B.kind === 'wild') sub = won ? `★ +${B.reward} · 펫 경험치 +40 · 재료 획득` : '경험치 조금 · 다음엔 이길 수 있어!';
    else sub = won ? '우리 팀 결전 승리! ★ +6' : '상대 팀 승리… ★ +1';
    txtO(sub, W / 2, H * 0.38 + 50 * U, 16 * U, '#fff', 'rgba(40,30,50,0.85)');
    if (my.trainer && my.petP) { const n = my.cmdN; txtO(`지시 ${n}번 · 친밀도 ${Math.round(my.bond * 100)}%`, W / 2, H * 0.38 + 78 * U, 13 * U, '#fff', 'rgba(40,30,50,0.85)'); }
  }
}
function drawFighter(f) {
  const hurtT = Math.max(0, f.hurtT);
  if (f.type === 'mon') {
    drawMonster(f.kind, f.x, f.y, f.r, { t: f.t, face: f.face, air: f.air || 0, angry: f.state === 'tele', tired: f.state === 'recover', flash: hurtT, alpha: f.hp <= 0 ? 0.5 : 1 });
    if (f.state === 'recover' && f.hp > 0) txtO('헉헉', f.x, f.y - f.r - 30, 12, '#4dabf7', '#fff');
  } else {
    if (f.buffT > 0) { ctx.strokeStyle = `rgba(255,107,107,${0.5 + 0.3 * Math.sin(f.t * 12)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 7, 0, TAU); ctx.stroke(); }
    if (f.team.specialT > 0 && f.team.gauge >= 100) { ctx.fillStyle = `rgba(255,212,59,${0.25 + 0.2 * Math.sin(f.t * 10)})`; ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 14, 0, TAU); ctx.fill(); }
    const mood = f.hp <= 0 ? 'tired' : hurtT > 0 ? 'hurt' : f.silly > 0 && f.sillyKind === 'nap' ? 'sleep' : f.special ? 'happy' : null;
    const sq = f.biteT > 0 ? -0.12 : f.dashT > 0 ? 0.1 : Math.sin(f.t * 5) * 0.03;
    drawCritter(f.x, f.y, f.r, f.color, { ears: f.ears, tail: true, face: f.face, t: f.t, mood, squash: sq, flash: hurtT, alpha: f.inv > 0 && !f.special ? 0.55 : 1 });
    if (f.biteT > 0) { ctx.fillStyle = '#fff'; for (const s of [-1, 1]) { const ax = f.x + f.face.x * (f.r + 6) + s * f.face.y * 7, ay = f.y + f.face.y * (f.r + 6) - s * f.face.x * 7; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + f.face.x * 9, ay + f.face.y * 9); ctx.lineTo(ax + s * f.face.y * 4, ay - s * f.face.x * 4); ctx.closePath(); ctx.fill(); } }
    if (f.silly > 0 && f.sillyKind === 'nap') txtO('Zz', f.x + f.r, f.y - f.r - 6 - Math.sin(f.t * 3) * 3, 14, '#5c7cfa', '#fff');
    if (f.silly > 0 && f.sillyKind === 'sniff') txtO('?', f.x + f.r, f.y - f.r - 8, 16, '#868e96', '#fff');
    if (f.shield > 0) { ctx.strokeStyle = 'rgba(233,196,106,0.95)'; ctx.fillStyle = 'rgba(233,196,106,0.18)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 9, 0, TAU); ctx.fill(); ctx.stroke(); }
    txtO(f.p.human ? '나' : f.name, f.x, f.y + f.r + 14, 11, f.p.human ? '#d6336c' : '#3a2e2a', '#fff');
  }
  const bw = f.r * 2.2; bar(f.x - bw / 2, f.y - f.r - 14 - (f.air || 0), bw, 5, f.hp / f.maxHp, f.side === B.mySide ? '#51cf66' : '#ff6b6b', 'rgba(0,0,0,0.25)');
}
function drawTeamTop(tm) {
  const L = B.L, f = tm.pet, y = 10 * U, w = B.ctrl.land ? Math.min(L.aw + 40 * U, 460 * U) : Math.min(W - 20 * U, 420 * U), x = B.ctrl.land ? L.ax + L.aw / 2 - w / 2 : (W - w) / 2, h = 46 * U;
  panel(x, y, w, h, 14 * U);
  if (f.type === 'mon') drawMonster(f.kind, x + 24 * U, y + h / 2 + 4 * U, 14 * U, { t: G.t });
  else drawCritter(x + 24 * U, y + h / 2 + 2 * U, 13 * U, f.color, { ears: f.ears, tail: true, t: G.t });
  const label = f.type === 'mon' ? `야생 ${f.name}` : `${f.name} (펫) · 트레이너 ${tm.trainer ? tm.trainer.name : '없음'}`;
  txt(label, x + 46 * U, y + 15 * U, 13 * U, '#3a2e2a', 'left', 900);
  bar(x + 46 * U, y + 27 * U, w - 120 * U, 9 * U, f.hp / f.maxHp, '#ff6b6b');
  txt(`${Math.ceil(f.hp)}/${f.maxHp}`, x + w - 70 * U, y + 32 * U, 11 * U, '#7a6a60', 'left', 800);
  const left = Math.max(0, Math.ceil(B.limit - B.time));
  txt(`${left}초`, x + w - 12 * U, y + 15 * U, 12 * U, left <= 10 ? '#e03131' : '#7a6a60', 'right', 900);
  if (f.type === 'pet') bar(x + 46 * U, y + 38 * U, (w - 120 * U) * 0.5, 4 * U, tm.gauge / 100, '#fcc419');
}
function drawControls(my) {
  const C = B.ctrl, top = C.y, f = my.pet, X0 = C.x, CW = C.w;
  ctx.fillStyle = 'rgba(255,250,243,0.55)'; rr(X0 + (C.land ? 6 * U : 0), top, CW - (C.land ? 12 * U : 0), H - top + 30, 22 * U); ctx.fill();
  // 내 팀 정보
  const ix = X0 + 12 * U, iy = top + 8 * U, iw = CW - 24 * U;
  drawCritter(ix + 16 * U, iy + 18 * U, 12 * U, f.color, { ears: f.ears, tail: true, t: G.t });
  const nm = `펫 ${f.p.human ? '나' : f.name} Lv${f.lv}` + (my.trainer ? ` · 트레이너 ${my.trainer.human ? '나' : my.trainer.name}` : ' · 혼자 싸우는 중');
  txt(nm, ix + 34 * U, iy + 9 * U, 12 * U, '#3a2e2a', 'left', 900);
  bar(ix + 34 * U, iy + 18 * U, iw * 0.42, 9 * U, f.hp / f.maxHp, '#51cf66');
  txt(`${Math.ceil(f.hp)}/${f.maxHp}`, ix + 38 * U + iw * 0.42, iy + 23 * U, 11 * U, '#7a6a60', 'left', 800);
  txt('필살', ix + 34 * U, iy + 37 * U, 10 * U, '#b08900', 'left', 900);
  bar(ix + 60 * U, iy + 33 * U, iw * 0.42 - 26 * U, 8 * U, my.gauge / 100, my.gauge >= 100 ? '#fab005' : '#ffe066');
  if (my.trainer) { txt('친밀도', ix + iw - 2 * U, iy + 9 * U, 10 * U, '#c2255c', 'right', 900); for (let i = 0; i < 5; i++) heart(ix + iw - 80 * U + i * 17 * U, iy + 27 * U, 14 * U, my.bond * 5 > i + 0.25); }
  const cy0 = top + 52 * U;
  if (B.humanRole === 'pet' && !AUTO) {
    const cyc = C.land ? Math.min((cy0 + H) / 2, cy0 + 150 * U) : (cy0 + H) / 2 + 4 * U;
    if (joy) drawJoy(joy.sx, joy.sy, true); else { drawJoy(X0 + CW * 0.24, cyc, false); txt('여기를 끌어서 이동', X0 + CW * 0.24, cyc + 64 * U, 11 * U, '#7a6a60', 'center', 800); }
    const d1 = 88 * U, d2 = 62 * U;
    button('bite', X0 + CW - 18 * U - d1, cyc - d1 / 2 + 10 * U, d1, d1, '물기', () => petBite(f), { round: true, color: '#ff8787', textCol: '#fff', size: 20 * U, cd: clamp(f.cd.bite / 0.42, 0, 1), sub: my.cmd && my.cmd.type === 'attack' ? '지금!' : 'J', glow: my.cmd && my.cmd.type === 'attack', glowCol: '#ff6b6b' });
    button('dash', X0 + CW - 30 * U - d1 - d2, cyc + 14 * U, d2, d2, '구르기', () => petDash(f, joyVec()), { round: true, color: '#74c0fc', textCol: '#fff', size: 15 * U, cd: clamp(f.cd.dash / 1.0, 0, 1), sub: 'K', glow: my.cmd && my.cmd.type === 'dodge', glowCol: '#4dabf7' });
    const spOk = my.gauge >= 100 && my.specialT > 0;
    button('sp', X0 + CW - 30 * U - d1 - d2, cyc - d2 - 4 * U, d2, d2, '필살', () => petSpecial(f), { round: true, color: '#ffd43b', textCol: '#6b4d00', size: 15 * U, disabled: !spOk, glow: spOk, sub: my.gauge >= 100 && !spOk ? '지시 대기' : 'L' });
  } else if (B.humanRole === 'trainer' && !AUTO) {
    const gap = 8 * U, bw = (CW - 24 * U - gap * 2) / 3, bh = 60 * U;
    const cmds = [['attack', '공격!', '#ff8787', 'Z'], ['dodge', '피해!', '#74c0fc', 'X'], ['special', '필살기!', '#ffd43b', 'C']];
    cmds.forEach(([k, l, c, key], i) => {
      const dis = k === 'special' ? my.gauge < 100 : false;
      button('cmd_' + k, X0 + 12 * U + i * (bw + gap), cy0, bw, bh, l, () => issueCmd(my, k), { color: c, textCol: k === 'special' ? '#6b4d00' : '#fff', size: 20 * U, cd: clamp(my.cmdCd / 1.3, 0, 1), disabled: dis, glow: (k === 'special' && !dis) || (k === 'dodge' && threatOn(f)), glowCol: k === 'dodge' ? '#4dabf7' : '#ffd43b', sub: key });
    });
    const it = my.trainer.items, ibw = (CW - 24 * U - gap * 3) / 4, ibh = Math.min(64 * U, H - cy0 - bh - 22 * U);
    ['heal', 'snack', 'shell', 'orb'].forEach((k, i) => {
      button('item_' + k, X0 + 12 * U + i * (ibw + gap), cy0 + bh + 12 * U, ibw, ibh, ITEM_NAME[k], () => useItem(my, k), { color: '#fff8ec', size: 14 * U, icon: (x, y, s) => itemIcon(k, x, y, s * 0.85), badge: it[k], disabled: it[k] <= 0, cd: clamp(my.itemCd / 1.5, 0, 1) });
    });
  } else {
    txt('자동 플레이 중', X0 + CW / 2, (cy0 + H) / 2, 14 * U, '#7a6a60', 'center', 800);
  }
}

// ---------------------------------------------------------------- 그리기: 타이틀 · 결과
function drawTitle() {
  drawWorld(); dimBg(0.25);
  const t = G.t;
  const pw = Math.min(W - 24 * U, 420 * U), ph = 470 * U, px = (W - pw) / 2, py = Math.max(12 * U, (H - ph) / 2);
  panel(px, py, pw, ph, 26 * U);
  txtO('누가 펫이야?', W / 2, py + 46 * U, 34 * U, '#d6336c', '#fff');
  txt('친구가 트레이너도, 펫도 될 수 있는 게임', W / 2, py + 80 * U, 14 * U, '#7a6a60', 'center', 800);
  const swap = Math.floor(t / 1.3) % 2;
  PDEF.forEach((d, i) => {
    const x = px + pw * (0.17 + i * 0.22), y = py + 136 * U - Math.abs(Math.sin(t * 3 + i)) * 8 * U;
    const isPet = (i + swap) % 2 === 0;
    drawCritter(x, y, 22 * U, d.color, isPet ? { ears: EARS[i], tail: true, t, mood: 'happy' } : { hat: true, ears: EARS[i], t });
    txt(isPet ? '펫' : '트레이너', x, py + 172 * U, 11 * U, isPet ? '#f08c00' : '#1c7ed6', 'center', 900);
  });
  const lines = [
    ['섬을 4명이 돌아다녀요', '(지금은 나 + 봇 3명)'],
    ['몬스터에 닿으면 근처 친구가 불려와요', ''],
    ['랜덤으로 한 명은 펫, 한 명은 트레이너!', ''],
    ['펫은 직접 싸우고, 트레이너는 지시·아이템', ''],
    ['시간이 끝나면 별 순위로 2:2 결전', ''],
  ];
  lines.forEach(([a, b], i) => { const y = py + 202 * U + i * 30 * U; ctx.fillStyle = '#ffe3ec'; ctx.beginPath(); ctx.arc(px + 30 * U, y, 10 * U, 0, TAU); ctx.fill(); txt(String(i + 1), px + 30 * U, y + 1, 12 * U, '#d6336c', 'center', 900); txt(a + (b ? ' ' + b : ''), px + 48 * U, y + 1, 13 * U, '#3a2e2a', 'left', 800); });
  button('start', px + 30 * U, py + ph - 108 * U, pw - 60 * U, 58 * U, '시작하기', () => startGame(), { color: '#ff8fab', textCol: '#fff', size: 22 * U });
  txt('PC: WASD 이동 · J 물기 · K 구르기 · L 필살 · Z/X/C 지시 · 1~4 아이템 · M 소리', W / 2, py + ph - 30 * U, 10 * U, '#9a8a80', 'center', 700);
  txt('프로토타입 v0.1', W / 2, py + ph - 14 * U, 10 * U, '#b9aaa0', 'center', 700);
}
function drawResults() {
  drawWorld(); dimBg(0.5);
  const r = G.result, me = human();
  const pw = Math.min(W - 24 * U, 420 * U), ph = 470 * U, px = (W - pw) / 2, py = Math.max(12 * U, (H - ph) / 2);
  panel(px, py, pw, ph, 26 * U);
  txtO(r.myWin ? '우리 팀 승리!' : '아쉽게 패배…', W / 2, py + 40 * U, 28 * U, r.myWin ? '#e8590c' : '#5c7cfa', '#fff');
  txt(`결전 승리: ${r.winTeam.map(p => p.name).join(' · ')}`, W / 2, py + 72 * U, 13 * U, '#7a6a60', 'center', 800);
  r.ranking.forEach((p, i) => {

    drawCritter(x + 52 * U, y + 28 * U, 15 * U, p.color, i === 0 ? { hat: true, ears: p.ears, t: G.t, mood: 'happy', hatCol: '#fcc419' } : { hat: true, ears: p.ears, t: G.t });

    star(x + w - 46 * U, y + 27 * U, 9 * U); txt(String(p.stars), x + w - 32 * U, y + 28 * U, 18 * U, '#3a2e2a', 'left', 900);
  });
  const rec = G.rec || {};
  txt(`지금까지 ${rec.plays || 0}판 · 우리 팀 승리 ${rec.wins || 0}번 · 최고 별 ${rec.best || 0}`, W / 2, py + ph - 86 * U, 11 * U, '#9a8a80', 'center', 700);
  button('again', px + 30 * U, py + ph - 72 * U, pw - 60 * U, 54 * U, '한 판 더', () => startGame(), { color: '#ff8fab', textCol: '#fff', size: 20 * U, disabled: G.resT < 0.6 });
}

// ---------------------------------------------------------------- 메인 루프
function draw() {
  buttons = [];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  switch (G.state) {
    case 'title': drawTitle(); break;
    case 'explore': drawWorld(); drawExploreHUD(); break;
    case 'roulette': drawRoulette(); break;
    case 'battle': drawBattle(); break;
    case 'finalIntro': drawFinalIntro(); break;
    case 'results': drawResults(); break;
  }
  if (G.state !== 'battle' && G.state !== 'title') {
    button('mute', 10 * U, 10 * U, 36 * U, 34 * U, muted ? '🔇' : '♪', () => { muted = !muted; initAudio(); }, { size: 16 * U, color: '#fffaf3' });
  }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try {
    for (let i = 0; i < SPEED; i++) { update(dt); pressed.clear(); }
    draw();
  } catch (e) { console.error(e); window.__err = String(e && e.stack || e); }
  requestAnimationFrame(frame);
}
newGame();
G.state = AUTO ? 'explore' : 'title';
window.__dbg = { get G() { return G; }, get B() { return B; }, encounter: () => { const m = G.monsters.find(x => !x.busy); human().x = m.x; human().y = m.y + 10; startEncounter(human(), m); }, final: () => { G.time = 0; }, step: (n = 1, dt = 1 / 60) => { for (let i = 0; i < n; i++) { update(dt); pressed.clear(); } draw(); }, startGame };
requestAnimationFrame(frame);
})();
</script>
