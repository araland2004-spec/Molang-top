# 몰랑탑 자동 빌드
# - main · ara · gunsoon 중 어디에 올려도: 세 브랜치를 모두 웹으로 만들어 한 사이트로 올려요.
#     main    → https://araland2004-spec.github.io/Molang-top/
#     ara     → https://araland2004-spec.github.io/Molang-top/ara/
#     gunsoon → https://araland2004-spec.github.io/Molang-top/gunsoon/
# - Actions 탭에서 "Run workflow" 누르고 apk 를 켜면: 안드로이드 APK 도 만들어요 (베타 때 사용).
name: build

on:
  push:
    branches: [main, ara, gunsoon]
  workflow_dispatch:
    inputs:
      apk:
        description: "안드로이드 APK 도 만들기"
        type: boolean
        default: false

env:
  GODOT_VERSION: "4.7.2"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ara · gunsoon 에 올리면: Pages 는 main 에서만 올릴 수 있어서 main 에서 다시 돌려요 (세 브랜치를 한 번에 빌드)
  kick:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run build.yml --ref main -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  web:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Godot 템플릿 캐시
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot 설치
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -sSL -o g.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q g.zip -d ~/godot-bin
          curl -sSL -o t.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q t.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: 브랜치마다 웹 내보내기
        run: |
          GODOT=~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p build/web
          for b in main ara gunsoon; do
            if ! git rev-parse --verify -q origin/$b >/dev/null; then echo "$b 브랜치 없음 — 건너뜀"; continue; fi
            rm -rf /tmp/src && git worktree add -f /tmp/src origin/$b
            out=build/web; [ "$b" != main ] && out=build/web/$b
            mkdir -p $out
            # 빌드 번호: 게임 안(scripts/build_id.gd)과 version.txt 에 같이 → 오래된 캐시면 게임이 알아채고 업데이트를 띄워요
            sha=$(git -C /tmp/src rev-parse --short HEAD)
            printf 'extends RefCounted\nconst ID := "%s"\n' "$sha" > /tmp/src/scripts/build_id.gd
            printf '%s' "$sha" > $out/version.txt
            (cd /tmp/src && $GODOT --headless --import >/dev/null 2>&1 || true)
            (cd /tmp/src && $GODOT --headless --export-release "Web" $GITHUB_WORKSPACE/$out/index.html)
            git worktree remove --force /tmp/src
          done
          touch build/web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  android:
    if: github.event_name == 'workflow_dispatch' && inputs.apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Godot 템플릿 캐시
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}
      - name: Godot 설치
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -sSL -o g.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q g.zip -d ~/godot-bin
          curl -sSL -o t.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q t.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      - name: 안드로이드 설정
        run: |
          keytool -genkeypair -v -keystore $HOME/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          GODOT=~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          $GODOT --headless --quit || true
          f=$(ls ~/.config/godot/editor_settings-*.tres | head -1)
          echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> "$f"
          echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$f"
      - name: APK 내보내기
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          GODOT=~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          $GODOT --headless --import || true
          mkdir -p build/android
          $GODOT --headless --export-debug "Android" build/android/molang.apk
      - name: 최신 APK 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 몰랑탑 테스트 APK
          prerelease: true
          files: build/android/molang.apk
